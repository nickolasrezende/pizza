<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora | Clube da Pizza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html" aria-label="Clube da Pizza Napolitana">
      <img src="imagens/logo-forno.png" alt="Logo forno">
      <span>
        <small>Clube da</small>
        <strong>PIZZA</strong>
        <em>NAPOLITANA</em>
      </span>
    </a>

    <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>

    <nav id="mainNav">
      <a href="index.html">INÍCIO</a>
      <a href="receitas.html">RECEITAS</a>
      <a href="farinhas.html">FARINHAS</a>
      <a href="calculadora.html">CALCULADORA</a>
      <a href="timer.html">TIMER</a>
      <a href="galeria.html">GALERIA</a>
      <a href="sobre.html">SOBRE</a>
    </nav>

    <button id="themeToggle" class="theme-toggle"><span>🌙</span> MODO ESCURO</button>
  </div>
</header>


<main class="container page">
  <div class="page-title">
    <p class="eyebrow">FERRAMENTA</p>
    <h1>Calculadora de massa</h1>
    <p>Calcula água, sal, fermento e quantidade de bolas.</p>
  </div>

  <section class="card calculator-box">
    <div class="form-grid">
      <label>Farinha (g)<input id="flour" type="number" value="1000"></label>
      <label>Hidratação (%)<input id="hydration" type="number" value="65"></label>
      <label>Sal (%)<input id="salt" type="number" value="2.8" step="0.1"></label>
      <label>Fermento seco (%)<input id="yeast" type="number" value="0.05" step="0.01"></label>
      <label>Peso por bola (g)<input id="ball" type="number" value="250"></label>
    </div>
    <button class="btn btn-red full" onclick="calculateDough()">CALCULAR</button>
    <div id="calcResult" class="calc-result"></div>
  </section>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <img src="imagens/logo-forno.png" alt="">
      <div>
        <strong>CLUBE DA PIZZA NAPOLITANA</strong>
        <p>Massas melhores. Amigos para sempre.</p>
      </div>
    </div>
    <p>Feito com ❤️ e muita farinha</p>
  </div>
</footer>
<script src="script.js"></script>
</body>
</html>
