<!DOCTYPE html><html lang="pt-BR" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Calculadora de Hidratação | Clube da Pizza</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><div class="container nav-wrap"><a class="logo" href="index.html">🍕 Clube Napolitano</a><button class="menu-toggle" id="menuToggle">☰</button><nav id="mainNav"><a href="index.html">Início</a><a href="receitas.html">Receitas</a><a href="farinhas.html">Farinhas</a><a href="calculadora.html">Calculadora</a><a href="timer.html">Timer</a><a href="galeria.html">Galeria</a><a href="sobre.html">Sobre</a><button class="theme-btn" id="themeToggle">🌙</button></nav></div></header>
<main class="container section"><div class="section-title"><p class="eyebrow">Ferramenta</p><h1>Calculadora de hidratação</h1><p>Calcula água, sal, azeite, fermento e peso aproximado da massa.</p></div><section class="tool-card"><div class="form-grid"><label>Farinha em gramas<input type="number" id="flour" value="1000" min="1"></label><label>Hidratação %<input type="number" id="hydration" value="65" min="1"></label><label>Sal %<input type="number" id="saltPercent" value="2.8" step="0.1"></label><label>Azeite %<input type="number" id="oilPercent" value="0" step="0.1"></label><label>Fermento seco %<input type="number" id="yeastPercent" value="0.1" step="0.01"></label><label>Peso por pizza em g<input type="number" id="ballWeight" value="250" min="1"></label></div><button class="btn primary full" onclick="calculateDough()">Calcular</button><div class="results" id="doughResults"><p>Preencha os campos e clique em calcular.</p></div></section></main>
<footer class="footer"><p>Clube da Pizza Napolitana • matemática da massa</p></footer><script src="script.js"></script></body></html>
