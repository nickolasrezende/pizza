<!DOCTYPE html><html lang="pt-BR" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Timer de Fermentação | Clube da Pizza</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><div class="container nav-wrap"><a class="logo" href="index.html">🍕 Clube Napolitano</a><button class="menu-toggle" id="menuToggle">☰</button><nav id="mainNav"><a href="index.html">Início</a><a href="receitas.html">Receitas</a><a href="farinhas.html">Farinhas</a><a href="calculadora.html">Calculadora</a><a href="timer.html">Timer</a><a href="galeria.html">Galeria</a><a href="sobre.html">Sobre</a><button class="theme-btn" id="themeToggle">🌙</button></nav></div></header>
<main class="container section"><div class="section-title"><p class="eyebrow">Controle</p><h1>Timer de fermentação</h1><p>Configure o tempo e acompanhe cada etapa da massa.</p></div><section class="tool-card timer-card"><label>Etapa<select id="timerLabel"><option>Autólise</option><option>Descanso pós-sova</option><option>Fermentação em bloco</option><option>Fermentação em bola</option><option>Pré-forno</option></select></label><div class="form-grid"><label>Horas<input type="number" id="hours" value="0" min="0"></label><label>Minutos<input type="number" id="minutes" value="30" min="0"></label></div><div class="timer-display" id="timerDisplay">00:30:00</div><div class="timer-actions"><button class="btn primary" onclick="startTimer()">Iniciar</button><button class="btn secondary" onclick="pauseTimer()">Pausar</button><button class="btn danger" onclick="resetTimer()">Resetar</button></div><p class="small" id="timerStatus">Timer parado.</p></section></main>
<footer class="footer"><p>Clube da Pizza Napolitana • respeita a fermentação, animal</p></footer><script src="script.js"></script></body></html>
